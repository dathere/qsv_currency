[package]
name = "qsv_currency"
version = "0.7.0"
authors = ["Joel Natividad <joel@datHere.com>"]
description = "A library for representing international currencies."
repository = "https://github.com/dathere/currency-rs"
documentation = "https://docs.rs/qsv_currency"
keywords = ["currency", "money", "bank", "international", "iso"]
categories = [
    "parser-implementations",
    "value-formatting",
    "internationalization",
]
license = "MIT"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
ahash        = "0.8"
iso_currency = { version = "0.7", features = ["iterator"] }
num          = "0.4"
serde        = "1"

[dev-dependencies]
serde_json   = "1"
serde_derive = "1"

[lints.clippy]
# priority -1 so the specific allow below wins over the group
pedantic = { level = "warn", priority = -1 }
# ToString::to_string takes &self, so `impl ToString` by value is not a needless move.
# Taking `&impl ToString` would force callers to write `Currency::from(1000, &'$')`.
needless_pass_by_value = "allow"
